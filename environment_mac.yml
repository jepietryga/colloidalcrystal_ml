name: facet_ml_env
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  # Core scientific stack
  - numpy=1.25
  - pandas=2.1
  - scipy
  - scikit-learn=1.2.0
  - numba
  - numexpr
  - llvmlite
  - matplotlib
  - seaborn
  - plotly
  - dash
  - dash-bootstrap-components
  - ipykernel
  - ipython
  - jupyter_client
  - jupyter_core
  - pytest

  - pillow
  - scikit-image
  - pyqt
  - libjpeg-turbo
  - libpng

  - tqdm
  - pyyaml
  - requests
  - packaging
  - setuptools
  - wheel
  - pytorch
  - torchvision
  - torchaudio

  - pip:
    - opencv-python<4.12
    - pycocotools
    - segment-anything
    - ray
    - shap
    - tensorboard
    - tensorboardx
    - fvcore
    - iopath
    - hydra-core
    - omegaconf
    - h5py<3.16
    - pyarrow
    - black
    - beautifulsoup4
